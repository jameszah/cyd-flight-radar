[platformio]
default_envs = fnk0104b
test_dir = tests

[env]
monitor_speed = 115200

[cyd_base]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
upload_speed = 921600
board_build.partitions = partitions/plane_radar.csv
extra_scripts = post:scripts/merge_firmware.py
board_build.embed_files = data/ui_font.vlw
build_flags =
  -std=gnu++17
  -DWM_NODEBUG
  -DWM_MDNS
  -I include/
  -I config/
  -D USE_HSPI_PORT=1
  -D TFT_MISO=12
  -D TFT_MOSI=13
  -D TFT_SCLK=14
  -D TFT_CS=15
  -D TFT_DC=2
lib_deps =
  lovyan03/LovyanGFX@^1.2.7
  bblanchon/ArduinoJson@^7.4.2
  jnthas/Improv WiFi Library@^0.0.4
  lvgl/lvgl@^8.3.11

[env:cyd_28r]
extends = cyd_base
build_flags =
  ${cyd_base.build_flags}
  -D ILI9341_DRIVER=1
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=320
  -D TFT_BL=21
  -D XPT2046_CS=33
  -D XPT2046_IRQ=36
  -D XPT2046_MOSI=32
  -D XPT2046_MISO=39
  -D XPT2046_CLK=25


[env:cyd_35c]
extends = cyd_base
build_flags =
  ${cyd_base.build_flags}
  -D ST7796_DRIVER=1
  -D TFT_WIDTH=320
  -D TFT_HEIGHT=480
  -D TFT_BL=27

; Freenove FNK0104B: ESP32-S3, 2.8" ILI9341 240x320, FT6336 capacitive touch (I2C 0x38).
; Pins from Freenove's TFT_eSPI setup FNK0104AB_2.8_240x320_ILI9341.h and Sketch_11.1_Touch.
; Native USB (no CH340): flash over the USB-C port; if upload fails, hold BOOT, tap RST, release BOOT.
[env:fnk0104b]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
upload_speed = 921600
board_build.partitions = partitions/plane_radar.csv
extra_scripts = post:scripts/merge_firmware.py
board_build.embed_files = data/ui_font.vlw
lib_deps = ${cyd_base.lib_deps}
build_flags =
  -std=gnu++17
  -DWM_NODEBUG
  -DWM_MDNS
  -I include/
  -I config/
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D BOARD_FNK0104B=1
  -D ILI9341_DRIVER=1
  -D TFT_INVERT=1
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=320
  -D TFT_MISO=13
  -D TFT_MOSI=11
  -D TFT_SCLK=12
  -D TFT_CS=10
  -D TFT_DC=46
  -D TFT_BL=45
  -D FT6336_TOUCH=1
  -D TOUCH_SDA=16
  -D TOUCH_SCL=15
  -D TOUCH_RST=18
  -D TOUCH_INT=17

; Freenove FNK0104S: ESP32-S3, 4.0" ST7796 320x480, FT6336 capacitive touch (I2C 0x38).
; Same LCD SPI and touch pins as the FNK0104B (Freenove's FNK0104S_4.0_320x480_ST7796.h setup and
; Sketch_11.1_Touch). Same layout as the 2.8": radar square is the full 320 width, panel below.
; Native USB: flash over the USB-C port; if upload fails, hold BOOT, tap RST, release BOOT.
[env:fnk0104s]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
upload_speed = 921600
board_build.partitions = partitions/plane_radar.csv
extra_scripts = post:scripts/merge_firmware.py
board_build.embed_files = data/ui_font.vlw
lib_deps = ${cyd_base.lib_deps}
build_flags =
  -std=gnu++17
  -DWM_NODEBUG
  -DWM_MDNS
  -I include/
  -I config/
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D BOARD_FNK0104S=1
  -D ST7796_DRIVER=1
  -D TFT_INVERT=1
  -D TFT_WIDTH=320
  -D TFT_HEIGHT=480
  ; Freenove's setup has no MISO for this panel (write-only).
  -D TFT_MISO=-1
  -D TFT_MOSI=11
  -D TFT_SCLK=12
  -D TFT_CS=10
  -D TFT_DC=46
  -D TFT_BL=45
  ; FSPI IOMUX pins; Freenove's own setup runs this panel at 80 MHz.
  -D TFT_SPI_HZ=80000000
  -D FT6336_TOUCH=1
  -D TOUCH_SDA=16
  -D TOUCH_SCL=15
  -D TOUCH_RST=18
  -D TOUCH_INT=17
  ; Print touch coordinates to serial.
  -D TOUCH_DEBUG=1
  ; Callsign above the type on the radar tags.
  -D TAG_CALLSIGN=1
  ; One line per aircraft (flight/type/alt/speed/dist) in the bottom panel.
  -D PANEL_LIST=1

; Freenove FNK0103N: ESP32 classic (WROOM, no PSRAM), 3.5" ST7796 320x480, XPT2046 resistive touch.
; Pins from Freenove's FNK0114N_3.5_320x480_ST7796.h TFT_eSPI setup (same wiring as the Sunton
; ESP32-3248S035R). Touch shares the LCD SPI bus (CS 33). Flashes through the USB-serial chip.
[env:fnk0103n]
extends = cyd_base
; COM port of this board on the owner's PC (COM3 is something else).
upload_port = COM10
monitor_port = COM10
build_flags =
  ${cyd_base.build_flags}
  -D BOARD_FNK0103N=1
  -D ST7796_DRIVER=1
  -D TFT_WIDTH=320
  -D TFT_HEIGHT=480
  -D TFT_BL=27
  -D XPT2046_SHARED_CS=33
  ; LCD pins are the HSPI IOMUX pins, so 80 MHz works (Freenove's own setup uses 80 MHz).
  -D TFT_SPI_HZ=80000000
  ; Radar sweep beam: 1 line (default 7).
  -D SWEEP_LINES=1
  ; Run the adsb.fi/TLS fetch task on core 0 so it doesn't stall drawing on core 1.
  -D FETCH_CORE=0
  ; Heap savers (no PSRAM; TLS needs a large free block): short trails, 20 aircraft slots
  ; instead of 40, and LVGL uses malloc instead of a fixed 24 KB pool (lv_conf.h).
  -D TRAIL_LENGTH=6
  -D MAX_AIRCRAFT=20
  ; Radar square edge in px (defaults to TFT_WIDTH). 320 needs a 100 KB frame sprite, which
  ; doesn't fit, so 240. -D RADAR_ZOOM=1 stretches it to 320 (blocky) instead of PLANE_LIST.
  -D RADAR_SIZE=240
  ; Aircraft list below the radar, clock/count in a strip to its right.
  -D PLANE_LIST=1
  ; Skip the adsbdb.com route (city pair) lookup when a plane is tapped.
  -D NO_ROUTE_LOOKUP=1
  ; Print touch coordinates to serial (for checking the resistive-touch calibration).
  -D TOUCH_DEBUG=1

[env:native]
test_build_src = yes
build_src_filter = +<utils_math.cpp> +<utils_adsb.cpp>
platform = native
test_framework = unity
build_flags =
  -std=gnu++17
  -I include/
  -I config/
  -D NATIVE_TEST
  -I .
  --coverage
  -lgcov
lib_deps =
  bblanchon/ArduinoJson@^7.4.2
