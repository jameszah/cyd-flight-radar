[platformio]
default_envs = fnk0104b
test_dir = tests

[env]
monitor_speed = 115200

[cyd_base]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
upload_speed = 921600
board_build.partitions = partitions/plane_radar.csv
extra_scripts = post:scripts/merge_firmware.py
board_build.embed_files = data/ui_font.vlw
build_flags =
  -std=gnu++17
  -DWM_NODEBUG
  -DWM_MDNS
  -I include/
  -I config/
  -D USE_HSPI_PORT=1
  -D TFT_MISO=12
  -D TFT_MOSI=13
  -D TFT_SCLK=14
  -D TFT_CS=15
  -D TFT_DC=2
lib_deps =
  lovyan03/LovyanGFX@^1.2.7
  bblanchon/ArduinoJson@^7.4.2
  jnthas/Improv WiFi Library@^0.0.4
  lvgl/lvgl@^8.3.11

[env:cyd_28r]
extends = cyd_base
build_flags =
  ${cyd_base.build_flags}
  -D ILI9341_DRIVER=1
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=320
  -D TFT_BL=21
  -D XPT2046_CS=33
  -D XPT2046_IRQ=36
  -D XPT2046_MOSI=32
  -D XPT2046_MISO=39
  -D XPT2046_CLK=25


[env:cyd_35c]
extends = cyd_base
build_flags =
  ${cyd_base.build_flags}
  -D ST7796_DRIVER=1
  -D TFT_WIDTH=320
  -D TFT_HEIGHT=480
  -D TFT_BL=27

; Freenove FNK0104B: ESP32-S3, 2.8" ILI9341 240x320, FT6336 capacitive touch (I2C 0x38).
; Pins from Freenove's TFT_eSPI setup FNK0104AB_2.8_240x320_ILI9341.h and Sketch_11.1_Touch.
; Native USB (no CH340): flash over the USB-C port; if upload fails, hold BOOT, tap RST, release BOOT.
[env:fnk0104b]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
upload_speed = 921600
board_build.partitions = partitions/plane_radar.csv
extra_scripts = post:scripts/merge_firmware.py
board_build.embed_files = data/ui_font.vlw
lib_deps = ${cyd_base.lib_deps}
build_flags =
  -std=gnu++17
  -DWM_NODEBUG
  -DWM_MDNS
  -I include/
  -I config/
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D BOARD_FNK0104B=1
  -D ILI9341_DRIVER=1
  -D TFT_INVERT=1
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=320
  -D TFT_MISO=13
  -D TFT_MOSI=11
  -D TFT_SCLK=12
  -D TFT_CS=10
  -D TFT_DC=46
  -D TFT_BL=45
  -D FT6336_TOUCH=1
  -D TOUCH_SDA=16
  -D TOUCH_SCL=15
  -D TOUCH_RST=18
  -D TOUCH_INT=17

[env:native]
test_build_src = yes
build_src_filter = +<utils_math.cpp> +<utils_adsb.cpp>
platform = native
test_framework = unity
build_flags =
  -std=gnu++17
  -I include/
  -I config/
  -D NATIVE_TEST
  -I .
  --coverage
  -lgcov
lib_deps =
  bblanchon/ArduinoJson@^7.4.2
